spring.application.name=estacionamento

spring.datasource.url=jdbc:sqlite:dados.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Dialeto oficial do Hibernate para gerar SQL correto do SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Cria ou atualiza as tabelas automaticamente com base nas classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Imprime os comandos SQL no console para aprendizado e depuracao
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
